name: API tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly strict run: any live test that needed to heal turns the build red.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting on PRs needs write access; the job stays read-only.
          GITLEAKS_ENABLE_COMMENTS: false

  api-tests:
    name: Playwright API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_USER: Emmanuel-Esplin
      # The workflow's own token: no personal token is stored.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAL_MODE: ${{ github.event_name == 'schedule' && 'strict' || 'report' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - name: Run tests (${{ env.HEAL_MODE }} mode)
        run: npx playwright test ${{ env.HEAL_MODE == 'strict' && '--fail-on-flaky-tests' || '' }}
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            results/
          retention-days: 7
